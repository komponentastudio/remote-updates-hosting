releaseNotes: "<h3>Call, Screen Share & Presence Fixes</h3><ul><li><b>No more audio echo on screen share.</b> Sharing a screen no longer doubles voices into an echo.</li><li><b>The app no longer gets lost.</b> Switching apps during a full-screen call won't make Remote disappear from the Dock -- click the Dock icon or Cmd-Tab to bring the call back.</li><li><b>Offline teammates look offline.</b> People who are offline no longer show as \"in meeting\" or display calendar/app status.</li><li><b>Accurate shared-screen cursor.</b> The pointer teammates see now lines up with where you're actually pointing, and your own cursor is no longer echoed to viewers.</li><li><b>No stray \"Call ended\" flash.</b> Entering full-screen projection no longer flashes a \"Call ended\" badge.</li><li><b>Take over screen sharing.</b> If someone is already sharing, you can now take over with a quick confirmation instead of asking them to stop first.</li></ul>"