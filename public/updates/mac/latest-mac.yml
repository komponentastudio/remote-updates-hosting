releaseNotes: "<h3>Call and Settings Fixes + Guest Badge</h3><ul><li><b>Mute indicator visible to everyone.</b> When you mute yourself in a call, the red microphone-slash badge now also appears on your bubble for everyone else (not just you).</li><li><b>Bubble video effect persists.</b> Switching your bubble to black-and-white (or any visual effect) no longer gets reset when you open Settings and click Save.</li><li><b>Calendar connection self-heals.</b> If the calendar session silently expires, the app now clears the stale credentials and prompts you to reconnect, instead of pretending to be connected. Logging out also fully disconnects the calendar.</li><li><b>Guest badge for external members.</b> Team members whose email doesn't match your company domain now get a small <b>Guest</b> badge next to their name in the lobby sidebar and in Settings &rarr; Team Members.</li><li><b>Accurate cursor during full-screen share.</b> When you share your full screen on a Retina or high-DPI display, the cursor your teammates see on your monitor now lines up with their actual pointer instead of drifting away.</li><li><i>Plus internal improvements to the development workflow (no end-user-visible change).</i></li></ul>"