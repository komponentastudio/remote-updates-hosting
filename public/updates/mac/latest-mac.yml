releaseNotes: "<h3>Call & Dock Fixes</h3><ul><li><b>The Dock icon stays put during calls.</b> Remote no longer disappears from the Dock while you're on a call, and clicking the Dock icon brings your lobby back instead of leaving it stuck behind the call window.</li><li><b>No more screen-share echo.</b> Sharing a screen no longer doubles remote voices into an echo.</li></ul>"